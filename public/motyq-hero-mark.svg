    <path d="M96 106 C104 92 111 78 123 68" stroke="url(#silver)" stroke-width="3.6"/>
    <path d="M110 107 C115 93 120 81 127 72" stroke="url(#silver)" stroke-width="3.6"/>
    <path d="M83 103 C95 90 103 76 120 64" stroke="url(#blue)" stroke-width="1.9" opacity=".9"/>
    <g fill="url(#blue)" filter="url(#glow)" stroke="none">
