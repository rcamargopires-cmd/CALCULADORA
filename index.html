<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Motyq" />
    <meta name="description" content="Motyq — inteligência para operação automotiva." />
    <title>Motyq | Inteligência para operação automotiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              excel: {
                yellow: '#FFFF00',
                header: '#FFD700',
              }
            },
            keyframes: {
              slideUpFade: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            },
            animation: {
              'fade-in': 'slideUpFade 0.5s ease-out forwards',
            }
          },
        },
      }
    </script>
    <script>
      (() => {
        const replacements = [
          ['DealMaster', 'Motyq'],
          ['DEALMASTER', 'MOTYQ'],
          ['dealmaster', 'motyq']
        ];

        const replaceValue = (value) => {
          if (!value) return value;
          return replacements.reduce((text, [from, to]) => text.split(from).join(to), value);
        };

        const replaceTextNodes = (root) => {
          if (!root) return;
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);
          nodes.forEach((node) => {
            const next = replaceValue(node.nodeValue || '');
            if (next !== node.nodeValue) node.nodeValue = next;
          });
        };

        const startBrandBridge = () => {
          document.title = 'Motyq | Inteligência para operação automotiva';
          replaceTextNodes(document.body);
          const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
              if (mutation.type === 'characterData') {
                const node = mutation.target;
                const next = replaceValue(node.nodeValue || '');
                if (next !== node.nodeValue) node.nodeValue = next;
                return;
              }
              mutation.addedNodes.forEach((node) => replaceTextNodes(node));
            });
          });
          observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', startBrandBridge, { once: true });
        } else {
          startBrandBridge();
        }
      })();
    </script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
<link rel="stylesheet" href="/dealmaster-theme.css">
</head>
  <body class="dealmaster-graphite bg-zinc-950 text-white">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
