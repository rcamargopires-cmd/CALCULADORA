name: Firestore Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Export Firestore database
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
          FIREBASE_BACKUP_BUCKET: ${{ secrets.FIREBASE_BACKUP_BUCKET }}
        run: |
          PROJECT_ID="${FIREBASE_PROJECT_ID:-gen-lang-client-0531247430}"
          DATABASE_ID="${FIREBASE_DATABASE_ID:-ai-studio-447676b4-da38-4e69-b22f-6aa10f85367b}"
          BUCKET="${FIREBASE_BACKUP_BUCKET:-gs://gen-lang-client-0531247430.firebasestorage.app}"
          STAMP="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          DEST="$BUCKET/motyq-backups/$STAMP"
          echo "Exporting project=$PROJECT_ID database=$DATABASE_ID to $DEST"
          gcloud firestore export "$DEST" \
            --project="$PROJECT_ID" \
            --database="$DATABASE_ID"
          echo "Firestore export completed successfully: $DEST"
          {
            echo "### MOTYQ Firestore backup"
            echo ""
            echo "- Project: `$PROJECT_ID`"
            echo "- Database: `$DATABASE_ID`"
            echo "- Destination: `$DEST`"
            echo "- Completed: `$(date -u +'%Y-%m-%dT%H:%M:%SZ')`"
          } >> "$GITHUB_STEP_SUMMARY"
